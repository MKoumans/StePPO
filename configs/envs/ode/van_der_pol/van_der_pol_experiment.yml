# Final 3-model x 2-training-regime comparison.
# Full rows train on the complete interval; binned rows train on separated
# intervals and are evaluated on the same full validation/test range.
model, env.train_bins, env.val_bins, env.test_bins, env.obs_features:
  - [empty_vdp, [[1.0, 100.0]], [[1.0, 100.0]], [[1.0, 100.0]], [state, step_context, solver_trend]]
  - [empty_vdp, [[5.0, 10.0], [20.0, 35.0], [60.0, 100.0]], [[1.0, 100.0]], [[1.0, 100.0]], [state, step_context, solver_trend]]
  - [vae_vdp_linear, [[1.0, 100.0]], [[1.0, 100.0]], [[1.0, 100.0]], [state, step_context, solver_trend]]
