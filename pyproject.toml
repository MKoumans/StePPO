[project]
name = "steppo"
version = "0.1.0"
description = "PPO trained step size controller for JAX-based ODE solvers"
authors = [{ name = "Milan Koumans", email = "mkoumans@tue.nl" }]
requires-python = ">=3.11"
dependencies = [
    # CUDA wheels exist for Linux only; elsewhere (macOS, native Windows) JAX runs on the CPU.
    "jax[cuda12]>=0.4.26; sys_platform == 'linux'",
    "jax>=0.4.26; sys_platform != 'linux'",
    "flax>=0.10",
    "optax",
    "distrax",
    "gymnax",
    "orbax-checkpoint",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "matplotlib",
    "pyyaml",
    "diffrax>=0.7.2,<0.8",
    "optimistix>=0.1.0,<0.2",
    "lineax>=0.1.1,<0.2",
    "openpyxl>=3.1.5,<4",
    "requests>=2.34.2,<3",
    "scipy>=1.14,<2",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.8,<0.17",
]

[project.optional-dependencies]
logging = ["wandb"]

[project.scripts]
steppo = "steppo.cli:main"
steppo-hf = "steppo.models.huggingface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.11.0,<4",
    "pytest-xdist>=3.8.0,<4",
    "pytest-cov>=7.1.0,<8",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark and not pipeline'"
markers = [
    "benchmark: multi-GPU throughput benchmarks (run with -m benchmark)",
    "pipeline: slow end-to-end CLI-script pipeline tests (run with -m pipeline)",
]
filterwarnings = [
    "ignore::DeprecationWarning:distrax.*",
    "ignore::DeprecationWarning:tensorflow_probability.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Scripts pin GPUs/precision (setup_devices, os.environ) before importing JAX.
"{research,paper}/**" = ["E402"]
"src/steppo/envs/ode/generate_pid_*_dataset.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steppo"]
