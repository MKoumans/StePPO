extends: ode_default
model: empty_vdp

exp_name: "fosm_default"
seed: 0
total_iters: 750      #
episodes_per_trial: 1 #
num_envs: 256         #
num_eval_episodes: 16 #
rollout_steps: 600    # eps=1e-3 needs ~935 total PID steps at D=1.5 (vs ~491 at eps=1e-2);
eval_max_steps: 600   # budget raised accordingly, with margin for an early/untrained policy
eval_interval: 50
log_interval: 20

precompute_baseline:
  eval_mus: [0.01, 0.1, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

env:
  system: fosm_smooth
  precision: float64
  t_end: 0.5
  dt0: 1.0e-5
  rtol: 1.0e-4
  atol: 1.0e-7
  dt_min: 1.0e-5    #
  dt_max: 1.0       # 2*pi/(10*omega), omega=50 -- Riley et al. Case 1 dt bound
  dt_log_gain: 2.5  # dt_next = clip(dt * exp(action * dt_log_gain), dt_min, dt_max)
  immediate_dt_action: true
  progress_warp: false
  survival_penalty: 0.0
  margin_penalty: 0.0
  D_min: 0.1
  D_max: 3.0
  sample_D: true
  fosm_w0: 0.1
  fosm_eps: 0.001
  obs_features: [state, step_context]
  task_sample_scheme: "binned"
  train_bins: [[0.1, 3.0]]
  val_bins: [[0.1, 3.0]]
  test_bins: [[0.1, 3.0]]
