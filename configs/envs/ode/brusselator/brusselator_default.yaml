# Brusselator — chemical oscillator with tunable stiffness.
# Hidden task: B (bifurcation parameter), sampled according to task_sample_scheme
# from [B_min, B_max].
# For A=1, limit cycle appears at B>2; stiffness grows with B.
extends: ode_default
# model: vae_vdp_linear
model: vae_vdp_3

exp_name: "brusselator_default"

total_iters: 1000     #
rollout_steps: 1200   #
eval_max_steps: 1200  #

precompute_baseline:
  eval_mus: [3, 4, 6, 8, 10, 15, 20, 25]  # stiffness spike sits in B~2-10, see outputs/runs/20260902 steps-vs-B sweep

vae:
  buffer_capacity_multiplier: 32 # Lower due to longer rollouts (1200 steps)
  deterministic_latent: true # Apparently works better

env:
  system: brusselator
  precision: float64
  t_end: 100
  dt0: 1.0e-4
  rtol: 1.0e-3
  atol: 1.0e-6
  dt_min: 1.0e-5
  dt_max: 5.0
  dt_log_gain: 2.5        # dt_next = clip(dt * exp(action * dt_log_gain), dt_min, dt_max), action in [-1,1] -> max exp(2.5) ~= 12.2x per step
  immediate_dt_action: true
  progress_warp: false  #
  B_min: 1.0            # Hopf bifurcation sits at B = 1 + A^2 = 2 (A is hardcoded 1.0).
  B_max: 50.0
  sample_B: true
  survival_penalty: 0.0   # explicit; was falling through to the ODEEnvConfig default
  margin_penalty: 0.0     # explicit; was falling through to the ODEEnvConfig default
  sample_y0: false  #
  y0_x: 0.5             # NOT on the fixed-point locus (A, B/A) = (1, B). y0=(1,3) was exactly the
  y0_y: 1.0             # fixed point at B=3, i.e. RHS(y0)=(0,0) — same trap as van_der_pol y0=(0,0).
  obs_features: [state, step_context] # see experiment: outputs/experiments/20260824/57cde7c4
  task_sample_scheme: "log-binned" # linear-uniform within each configured bin
  train_bins: [[5.0,10.0], [20.0, 25.0], [35.0, 40.0]] # [[1.0, 15.0], [15.0, 50.0]]    # full training range
  val_bins: [[1.0, 50.0]]      # full validation range
  test_bins: [[1.0, 50.0]]     # full test range
